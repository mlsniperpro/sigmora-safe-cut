[project]
name = "safecut"
version = "0.1.0"
description = "Sigmora Safe Cut: hide everyone who shouldn't be published, prove it with an audit and a receipt."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.9",
    "meta-sam-parser==0.1.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.8",
    "orjson>=3.10",
    "pillow>=11.0",
    "pycocotools>=2.0.8",
    "pydantic>=2.9",
    "scipy>=1.14",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
]
# PRE-A §12: EgoBlur 2.0.1 hard-pins torch 2.9.1, torchvision 0.24.1 and vrs 1.2.2 (default-PyPI torch).
audit = ["egoblur==2.0.1", "torch==2.9.1", "torchvision==0.24.1", "vrs==1.2.2"]
deploy = ["modal==1.6.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["safecut"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N", "S", "ASYNC", "PT", "TRY", "C4", "PIE", "RET"]
ignore = ["PLR0913", "PLR2004", "TRY003", "N818", "PLR0911", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "ASYNC240"]
"scripts/**" = ["T201", "ASYNC240"]  # one-shot CLI probes write small files

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"  # live tests: uv run pytest -m live (needs MODEL_API_KEY)
asyncio_mode = "auto"
markers = ["live: calls the real Meta Model API (needs MODEL_API_KEY; spends credits)"]

[tool.pyright]
include = ["safecut", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["safecut", "scripts"]
reportMissingTypeStubs = false
