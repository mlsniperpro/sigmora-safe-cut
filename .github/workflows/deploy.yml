name: deploy

# Deploys the API to Modal on every push to main. GitHub Actions is for deployment only (AGENTS.md), so there is no CI
# workflow: this job runs the release-blocking checks itself (ruff, pyright, the offline pytest suite and the
# eval/report.py --check), then smoke-tests the image (a replay job, the ledger and the
# EgoBlur GPU function on the weights Volume), deploys, then proves a replay job end to end through the deployed app
# with its audit on the GPU, and checks the live URLs, starting with a cold wake of the scale-to-zero API.
# Without the Modal secrets (an owner input, BLOCKED.md) it skips with a notice instead of failing.
# SAFECUT_DEPLOY_GPU=0 (a repository variable; empty means GPU on) deploys with no GPU function at all, for a Modal
# workspace without a payment method: every GPU step and check is skipped and the audit runs YuNet in the API.

on:
  # A red main is never deployed: the checks below run first, in this job.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  modal:
    runs-on: ubuntu-latest
    # The offline suite (about 1,460 tests) runs 15 to 20 minutes, and a first deploy builds two images (one with
    # torch) and waits for a cold GPU: allow both.
    timeout-minutes: 90
    # Only a push to this repository's own main (a fork can't push here) or a manual run: the secrets never run a
    # fork's code. No pull-request trigger and no trigger on another workflow, ever.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SAFECUT_API_URL: ${{ vars.SAFECUT_API_URL }}
      SAFECUT_WEB_URL: ${{ vars.SAFECUT_WEB_URL }}
      # "1" only for a hotfix during a GPU outage: every GPU check warns instead of failing (BLOCKED.md).
      SAFECUT_DEPLOY_GPU_OPTIONAL: ${{ vars.SAFECUT_DEPLOY_GPU_OPTIONAL }}
      # "0": no GPU function is defined (Modal refuses the whole app otherwise without a card); empty: GPU on.
      SAFECUT_DEPLOY_GPU: ${{ vars.SAFECUT_DEPLOY_GPU }}
    steps:
      - name: Check for the Modal secrets
        id: gate
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::notice title=Deploy skipped::MODAL_TOKEN_ID and MODAL_TOKEN_SECRET aren't set as repository secrets yet (see BLOCKED.md); nothing was deployed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.run == 'true'
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install the dev and deploy tools (the audit group stays off; the tests use the replay stub)
        if: steps.gate.outputs.run == 'true'
        run: uv sync --locked --python 3.12 --all-groups --no-group audit
      - name: Release-blocking checks (lint, format, types, the offline tests, RESULTS.md matches the eval runs)
        if: steps.gate.outputs.run == 'true'
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
          uv run pyright
          uv run pytest -m "not live"
          uv run python eval/report.py --check
      - name: Smoke-test the image before it goes live (the demo job replayed, the ledger, EgoBlur on the GPU unless SAFECUT_DEPLOY_GPU=0)
        if: steps.gate.outputs.run == 'true'
        run: uv run modal run deploy/modal_app.py
      - name: Deploy the API, the GPU auditor, the worker smoke and the deletion cron (only after the smoke passed)
        if: steps.gate.outputs.run == 'true'
        # recreate, not the default rolling: a running job's hold input would keep the old container draining while
        # a new one's start resumed the same job (two writers, paid twice). Recreate publishes, then stops the old
        # containers (waiting up to 40 s), which exit without waiting for their jobs: the new one resumes them once.
        run: uv run modal deploy --strategy recreate deploy/modal_app.py
      - name: Prove one replay job end to end on the deployed app, audited by EgoBlur on the GPU (YuNet if SAFECUT_DEPLOY_GPU=0)
        if: steps.gate.outputs.run == 'true'
        run: uv run python -m deploy.verify_deploy
      - name: Check the live URLs (the first request wakes the API from zero)
        if: steps.gate.outputs.run == 'true'
        env:
          # Nothing has called the new API yet, and it keeps no warm container: its first answer must be a cold wake.
          DEPLOY_EXPECT_COLD: "1"
          # A YuNet audit is the expected one with no GPU deployed, and accepted during a GPU outage's hotfix.
          DEPLOY_YUNET_OK: ${{ (vars.SAFECUT_DEPLOY_GPU == '0' || vars.SAFECUT_DEPLOY_GPU_OPTIONAL == 'nogpu') && '1' || vars.SAFECUT_DEPLOY_GPU_OPTIONAL }}
        run: |
          # A deploy is green only once its live URLs pass: the variables are an owner step (BLOCKED.md).
          if [ -z "$SAFECUT_API_URL" ] || [ -z "$SAFECUT_WEB_URL" ]; then
            echo "::error title=Deploy not checked::set the SAFECUT_API_URL and SAFECUT_WEB_URL repository variables (BLOCKED.md); the deployment was not health-checked"
            exit 1
          fi
          bash scripts/deploy-check.sh "$SAFECUT_API_URL" "$SAFECUT_WEB_URL"
